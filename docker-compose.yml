services:
  backend:
    image: ghcr.io/zockerei/secret-santa-backend:latest
    container_name: secret-santa-backend
    restart: unless-stopped
    pull_policy: always
    env_file: .env

    volumes:
      - logs:/app/logs

    networks:
      br0:
        ipv4_address: ${BACKEND_IP:?Set BACKEND_IP in .env}

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    labels:
      - com.centurylinklabs.watchtower.enable=true

volumes:
  logs:

networks:
  br0:
    external: true
